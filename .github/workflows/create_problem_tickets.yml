name: Create Problem Tickets

on:
  pull_request:
    types:
      - closed

jobs:
  create-tickets:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install additional dependencies
        run: |
          pip install pyyaml

      - name: Debug JIRA_TOKEN
        run: |
          echo "JIRA_TOKEN is set to: $JIRA_TOKEN"
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

      - name: Validate JIRA_TOKEN
        run: |
          if [ -z "$JIRA_TOKEN" ]; then
            echo "JIRA_TOKEN is not set. Failing the job."
            exit 1
          fi

      - name: Export JIRA_TOKEN
        run: echo "JIRA_TOKEN=${{ secrets.JIRA_TOKEN }}" >> $GITHUB_ENV

      - name: Create Problem Tickets
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python qa_to_html.py  # Replace with the actual script to create tickets