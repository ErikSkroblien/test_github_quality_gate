name: QA Markdown Quality Gate

on:
  pull_request:
    paths:
      - '**qa_*.md'
      - '**.md'

jobs:
  check_markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Validate QA Markdown
        run: |
          echo "Checking QA markdown files..."

          FAIL=0

          for file in $(find . -name "qa_*.md"); do
            echo "Checking $file"

            while read -r line; do
              if [[ "$line" == Evidence:* ]]; then
                VALUE=$(echo "$line" | sed 's/Evidence://g' | xargs)

                if [ -z "$VALUE" ]; then
                  echo "ERROR: Missing evidence in $file"
                  FAIL=1
                fi
              fi
            done < "$file"

          done

          if [ $FAIL -eq 1 ]; then
            echo "Quality Gate FAILED"
            exit 1
          else
            echo "Quality Gate PASSED"
          fi